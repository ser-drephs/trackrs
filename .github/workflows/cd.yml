name: CD

on:
  push:
    branches: [ main ]
    paths: [ src/** ]
  workflow_dispatch:

# Only checkout and cache use the automatic token; the release uses the SEMREL_TOKEN secret.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: prepare scripts
      if: success()
      run: chmod +x ${{ github.workspace }}/eng/set-version.sh && chmod +x ${{ github.workspace }}/eng/build-release.sh && chmod +x ${{ github.workspace }}/eng/update-flake.sh

    # Fails fast if SEMREL_TOKEN can't push or publish releases, before building anything.
    - name: check release permissions
      run: bash eng/check-release-permissions.sh
      env:
        GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}

    - name: restore cargo cache
      uses: actions/cache@v4
      env:
        cache-name: ci
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
        key: ubuntu-latest-${{ env.cache-name }}-nightly-${{ hashFiles('Cargo.lock') }}

    - name: install mingw
      run: sudo apt-get update && sudo apt-get -y install --no-install-recommends mingw-w64

    - name: add windows target
      run: rustup target add x86_64-pc-windows-gnu

    - name: install rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal
        components: rustfmt, clippy

    - name: targets list
      run: rustup target list | grep installed

    - name: build release linux
      id: build-linux-release
      if: success()
      run: make build-release-linux-musl

    - name: build release windows
      id: build-windows-release
      if: success()
      run: make build-release-win

    # # - name: build release mac
    # #   id: build-mac-release
    # #   if: ${{ steps.semantic-version.outputs.new_release_published == 'true' }}
    # #   run: make build-release-mac

    - name: publish release
      uses: cycjimmy/semantic-release-action@v4
      if: success()
      with:
        dry_run: false
        extra_plugins: |
          @semantic-release/changelog@6
          @semantic-release/git@10
          @semantic-release/exec@6
          conventional-changelog-conventionalcommits@8
      env:
        GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}
