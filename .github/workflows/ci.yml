name: CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: self-hosted

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: restore cargo cache
      uses: actions/cache@v4
      env:
        cache-name: trackrs-cache
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
        key: self-hosted-${{ env.cache-name }}-nightly-${{ hashFiles('Cargo.lock') }}

    - name: install rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal
        components: rustfmt, clippy

  build:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - os: linux
            target: build-ci
          - os: windows
            target: build-ci-win
    needs: prepare
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: restore cargo cache
      uses: actions/cache@v4
      env:
        cache-name: trackrs-cache
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
        key: self-hosted-${{ env.cache-name }}-nightly-${{ hashFiles('Cargo.lock') }}

    - name: build ${{ matrix.target }}
      run: make ${{ matrix.target }}

  test:
    runs-on: self-hosted
    needs: prepare
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: restore cargo cache
      uses: actions/cache@v4
      env:
        cache-name: trackrs-cache
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
        key: self-hosted-${{ env.cache-name }}-nightly-${{ hashFiles('Cargo.lock') }}

    - name: run tests
      id: test
      if: success()
      run: make test
